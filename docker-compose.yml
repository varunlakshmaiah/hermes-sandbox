# Deploy: ./hermes setup   (or: OPENAI_API_KEY=... docker compose up -d --wait)
# Prebuilt images are pulled from GHCR; Compose builds from source if they are unavailable.
services:
  hermes-gateway:
    image: ghcr.io/varunlakshmaiah/hermes-sandbox/gateway:${HERMES_SANDBOX_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HERMES_MODEL: ${HERMES_MODEL:-}
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_DASHBOARD: "false"
    ports:
      - "127.0.0.1:${HERMES_API_PORT:-8000}:8000"
    volumes:
      - hermes_data:/opt/data
      - hermes_skills:/opt/data/skills
      - hermes_public_keys:/run/hermes-public
    depends_on:
      hermes-sandbox:
        condition: service_healthy
    stop_grace_period: 60s

  hermes-sandbox:
    image: ghcr.io/varunlakshmaiah/hermes-sandbox/sandbox:${HERMES_SANDBOX_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    user: "10000:10000"
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    mem_limit: 2G
    cpus: 2.0
    pids_limit: 256
    volumes:
      - hermes_workspace:/workspace
      - hermes_public_keys:/run/hermes-public:ro
    stop_grace_period: 15s

volumes:
  hermes_data:
  hermes_skills:
  hermes_workspace:
  hermes_public_keys:
